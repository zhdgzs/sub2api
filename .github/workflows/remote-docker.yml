name: Remote Docker Release

on:
  push:
    branches:
      - cust
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: remote-docker-cust
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cust
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: cust

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-zhdgzs\.[0-9]+$'; then
            echo "Unsupported VERSION value: $VERSION" >&2
            exit 1
          fi

          FILE_VERSION="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          if [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "VERSION mismatch: version=$VERSION file=$FILE_VERSION" >&2
            exit 1
          fi

          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/sub2api"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

      - name: Validate cust branch
        shell: bash
        run: |
          git fetch origin cust:refs/remotes/origin/cust
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/cust)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:cust
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
